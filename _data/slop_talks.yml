# Talks for the "This Week in Slop" seminar page (theweekinslop/index.html).
#
# One entry per talk. The page sorts them by date and puts each talk under
# "Upcoming" or "Past" automatically (as of the last time the site was built).
# Leave `date` empty for a talk whose date isn't fixed yet: it is listed under
# Upcoming as "date to be announced".
#
# Fields (all optional except speaker and title):
#   date:        2026-12-03            (YYYY-MM-DD)
#   time:        "14:15"               (only if it differs from the usual time)
#   room:        "MA 313"              (only if it differs from the usual room)
#   speaker:     Name
#   affiliation: TU Berlin
#   title:       Talk title
#   format:      Dissection | Survey | Discussion | Workshop
#   abstract: >
#     Abstract text. HTML is allowed, e.g. <a href="...">links</a>.
#   links:                             (the claim under discussion, slides, notes ...)
#     - label: arXiv
#       url: https://arxiv.org/abs/...
#   outcome: >
#     For past talks: a sentence or two on what was found.

- date:
  speaker: Dominic Bunnett
  affiliation: TU Berlin
  title: Michałek’s AI-generated proof of Oda’s conjecture for smooth lattice polytopes in dimension 3
  format: Dissection
  abstract: >
    We discuss Michałek's proof that every smooth lattice 3-polytope is normal, settling Oda's normality question in dimension three. According to the paper's preface, the article is AI-generated apart from the preface itself. The proof was also autoformalised in Lean.
  links:
    - label: "M. Michałek, Normality of smooth lattice three-polytopes (PDF)"
      url: https://www.math.uni-konstanz.de/~michalek/oda_normality.pdf
