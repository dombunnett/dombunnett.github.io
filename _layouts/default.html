<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Dominic Bunnett">
        <meta name="description" content="{{ page.description | default: page.title | escape }}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <link href='https://fonts.googleapis.com/css?family=Inconsolata:400,700' rel='stylesheet' type='text/css'>
        <title>Dominic Bunnett — {{ page.title }}</title>
        <script>
            // MathJax: draws the maths in posts. Kramdown hands it \( \) and \[ \].
            window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] } };
        </script>
        <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
        <style>
body {
    background-color: #f8f8f8;
    font-family: 'Inconsolata', monospace;
    font-size: 15px;
    color: #222;
}
.myDiv {
    background-color: #2F4F4F;
    color: white;
    text-align: center;
}
.nav-inner {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 34px;
    padding: 12px 0;
    flex-wrap: wrap;
}
a:link { color: darkblue; background-color: transparent; text-decoration: none; }
a:visited { color: #666; background-color: transparent; text-decoration: none; }
a:hover { color: yellow; background-color: transparent; text-decoration: underline; }
.myDiv a:link, .myDiv a:visited { color: white; }
.myDiv a:hover { color: yellow; }
h2 {
    font-size: 1.4rem;
    font-weight: 700;
    border-bottom: 1px solid #ccc;
    padding-bottom: 6px;
    margin-bottom: 14px;
}

/* Blog */
.post-list { list-style: none; padding-left: 0; }
.post-list li { margin-bottom: 18px; }
.post-date { color: #777; margin-right: 10px; }
.post-summary { color: #555; display: block; margin-top: 2px; }
.post { max-width: 46rem; line-height: 1.6; }
.post-title { font-size: 1.7rem; font-weight: 700; margin-bottom: 4px; }
.post-meta { color: #777; margin-bottom: 28px; }
.post h2 { margin-top: 32px; }
.post h3 { font-size: 1.15rem; font-weight: 700; margin-top: 24px; }
.post pre {
    background: #eceeee;
    border-left: 3px solid #2F4F4F;
    padding: 10px 14px;
    font-size: 14px;
    overflow-x: auto;
}
.post code { color: #2F4F4F; }
.post table { margin-bottom: 1rem; }
.post th, .post td { border-bottom: 1px solid #ddd; padding: 4px 14px 4px 0; }
.post blockquote { border-left: 3px solid #ccc; padding-left: 14px; color: #555; }
.post img { max-width: 100%; }
        </style>
    </head>
    <body>
        <nav class="myDiv">
            <div class="nav-inner">
                <a href="/index.html">Home</a>
                <a href="/index.html#research">Research</a>
                <a href="/zoo/">Zoo</a>
                <a href="/talks.html">Talks</a>
                <a href="/teaching.html">Teaching</a>
                <a href="/outreach.html">Research development</a>
                <a href="/writing.html">Writing</a>
                <a href="/blog/">Blog</a>
            </div>
        </nav>

        <div class="container">
            <div class="row">
                <div class="col-md-10 offset-md-1" style="margin-top: 2rem; margin-bottom: 3rem;">
{{ content }}
                </div>
            </div>
        </div>
        <script data-goatcounter="https://dombunnett.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    </body>
</html>
